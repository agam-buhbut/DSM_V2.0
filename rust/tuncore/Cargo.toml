[package]
name = "dsm-tuncore"
version = "0.1.0"
edition = "2021"

[lib]
name = "tuncore"
crate-type = ["cdylib", "rlib"]

[features]
# Production default: the TPM 2.0 key-residency backend (non-extractable
# ECDSA P-256 attest key, signs in-TPM). Flipped from `dev-soft-attest` in
# Phase-3 Task 3.11 once the backend was proven end-to-end. The two backends
# are mutually exclusive at compile time (see the `compile_error!` guard in
# device_attest.rs), so a wheel carries exactly one. Build the dev/test soft
# wheel explicitly with `--no-default-features --features dev-soft-attest`.
default = ["tpm-attest"]
# Software ECDSA P-256 attestation backend. Dev/CI/test only — keys are
# extractable from process memory. Replaced by `tpm-attest` (Linux, the
# default) and the Android Keystore JNI backend (Android) for production.
dev-soft-attest = ["dep:p256", "dep:rcgen"]
# Real TPM 2.0 backend. tss-esapi 7.7.0 (stable); tss-esapi-sys 0.6.0 ships
# pregenerated bindings for x86_64-linux (no bindgen/libclang). Links the
# system tss2-esys via pkg-config at build time.
# `p256` is reused here purely for SPKI/signature DER encoding+decoding of the
# in-TPM public key — NOT for any signing scalar (that never leaves the TPM).
# It is already in the lockfile via `dev-soft-attest`, so this adds no new crate.
tpm-attest = ["dep:tss-esapi", "dep:p256"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"] }
snow = "0.9"
aes-gcm = { version = "0.10", features = ["zeroize"] }
hkdf = "0.12"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }
rand = "0.8.6"
rand_core = { version = "0.6", features = ["getrandom"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
serde = { version = "1", features = ["derive"] }
libc = "0.2"
subtle = "2"
hmac = "0.12"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"], optional = true }
# CSR generation entirely in Rust so the ECDSA signing scalar never crosses
# the FFI boundary into Python's `bytes`-managed memory during `dsm enroll`.
# Soft attest backend only; production TPM/Keystore backends will use the
# platform-native CSR API (PKCS#11 or Android KeyAttestation) and skip this dep.
rcgen = { version = "0.13", default-features = false, features = ["pem", "crypto", "ring"], optional = true }
# Real TPM 2.0 backend (gated by `tpm-attest`). tss-esapi-sys 0.6.0 ships
# pregenerated bindings for x86_64-linux and links the system tss2-esys via
# pkg-config — no bindgen/libclang at build time.
tss-esapi = { version = "7.7.0", optional = true }

[dev-dependencies]
# Phase-5 perf baseline: criterion drives the AEAD floor benchmark
# (benches/aead.rs). Standard Rust micro-benchmark harness; dev-only,
# never shipped in the wheel.
criterion = "0.5"

[[bench]]
name = "aead"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
