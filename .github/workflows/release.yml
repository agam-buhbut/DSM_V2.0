name: Release

# Tag-triggered Release pipeline (distinct from ci.yml). On a `v*` tag this
# REUSES the ci.yml gate suite as a hard precondition, builds the three
# supported-distro artifacts (tpm-attest wheel, +soft eval wheel, sdist),
# checksums them, signs the checksum file with the owner's minisign key, and
# publishes a GitHub Release with the signed artifacts attached.
#
# SUPPLY-CHAIN PINNING: every third-party action is pinned to a full 40-hex
# commit SHA (not a floating tag), with a trailing comment naming the version
# that SHA corresponds to. The SHAs were resolved against the GitHub API at
# authoring time.

on:
  push:
    tags: [ 'v*' ]

# Minimal permissions: only what is needed to create the Release and upload
# its assets. Nothing else (no packages:, id-token:, pull-requests:, etc.).
permissions:
  contents: write          # create the Release + upload assets

jobs:
  # Reuse the per-PR gate suite as a hard precondition: a tag can never publish
  # artifacts that did not pass black/isort/ruff/pylint/pyright/pytest +
  # clippy/cargo-test/cargo-audit (with the documented RUSTSEC ignores) +
  # pip-audit + the swtpm TPM lane. This is a local reusable-workflow call, so
  # it is exempt from the third-party SHA-pin rule (it is this repo's own file).
  gate:
    uses: ./.github/workflows/ci.yml

  build-tpm-wheel:
    needs: gate
    # The oldest glibc here (2.35): the wheel then installs on Debian 12 (2.36).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
      # dtolnay/rust-toolchain@stable is a moving alias by design; pinned to the
      # commit SHA the `stable` branch pointed at, per supply-chain policy.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable branch
        with:
          components: rustfmt, clippy
      # TPM lane build deps mirror ci.yml's tpm-attest job: the tss2-esys headers
      # (libtss2-dev) for the build/link, plus the device TCTI runtime object.
      # patchelf: maturin's repair step, which copies libtss2 into the wheel,
      # needs it (deploy/GUIDE.md §0b). The soft wheel links nothing to copy.
      - name: Install TSS2 build stack
        run: |
          sudo apt-get update
          sudo apt-get install -y libtss2-dev libtss2-tcti-device0 patchelf
      - name: Build TPM (production) wheel
        run: |
          python -m pip install --upgrade pip
          pip install maturin
          # maturin's repair step copies the libtss2 libraries into the wheel
          # and tags it manylinux_2_<glibc>_x86_64 (deploy/GUIDE.md §1a.1);
          # install.sh finds it by its name's start and end.
          maturin build --release --no-default-features --features tpm-attest --out dist
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: tpm-wheel
          path: dist/*.whl

  build-soft-wheel:
    needs: gate
    # The oldest glibc here (2.35): the wheel then installs on Debian 12 (2.36).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable branch
        with:
          components: rustfmt, clippy
      - name: Build +soft (evaluation) wheel
        run: |
          python -m pip install --upgrade pip
          pip install maturin
          # The +soft EVALUATION wheel: software attest backend, extractable key,
          # NO hardware binding; it must never be deployed in production.
          # maturin names the wheel after pyproject.toml's version, so this
          # checkout's copy gets a +soft local version: the wheel is then
          # dsm-<version>+soft-cp311-abi3-*.whl, the name install.sh --eval
          # looks for, and never the TPM wheel's name in dist/.
          sed -i 's/^version = "\([^"+]*\)"$/version = "\1+soft"/' pyproject.toml
          grep -q '^version = "[^"]*+soft"$' pyproject.toml
          maturin build --release --no-default-features --features dev-soft-attest --out dist
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: soft-wheel
          path: dist/*.whl

  build-sdist:
    needs: gate
    # Pinned with the wheel jobs (glibc 2.35, below Debian 12's 2.36).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"
      - name: Build sdist (build-from-source fallback)
        run: |
          python -m pip install --upgrade pip
          pip install maturin
          maturin sdist --out dist
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: sdist
          path: dist/*.tar.gz

  sign-and-publish:
    needs: [ build-tpm-wheel, build-soft-wheel, build-sdist ]
    # A current runner, for a current minisign to sign with. The dependency
    # wheels do not depend on its glibc (the --platform flags below).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          # The supported runtime floor is requires-python>=3.11; the step
          # below downloads the dependency wheels for each supported Python.
          python-version: "3.11"
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          path: dist
          merge-multiple: true
      - name: Stage install.sh and the systemd units alongside artifacts
        run: |
          cp install.sh dist/install.sh
          # install.sh --systemd fetches these from the Release and checks
          # them against the signed SHA256SUMS: a curl | sh install has no
          # deploy/ folder.
          cp deploy/dsm.service deploy/dsm-client.service \
             deploy/dsm-blocklist-update.sh deploy/dsm-blocklist-update.service \
             deploy/dsm-blocklist-update.timer dist/
      # Vendor the RUNTIME dependency wheels into the SAME dir as the DSM wheel
      # so they land in the SAME minisign-signed SHA256SUMS and are uploaded as
      # release assets next to it. DSM's model is "no PyPI at install time —
      # signed GitHub Releases": PyPI is used HERE (a build step) only to STAGE
      # the wheelhouse; install.sh later fetches these from the Release and
      # verifies every one against this signed SHA256SUMS (same trust anchor).
      #
      # --only-binary=:all: forbids any sdist (the installer is --no-index, so a
      # source dist could not build on the target anyway). --require-hashes pins
      # the resolved set to the committed requirements.lock (147 hashed pins,
      # generated with --generate-hashes): the vendored wheelhouse is EXACTLY the
      # locked runtime closure (cryptography -> cffi -> pycparser; dnspython is
      # pure-Python), so a compromised index cannot substitute an unpinned dep.
      # One download per supported Python (3.11 on Debian 12, 3.12 on Ubuntu
      # 24.04, 3.13 on Debian 13): cffi is not abi3, so each Python needs its
      # own cffi wheel, and install.sh's venv install is --no-index. The
      # abi3 and pure wheels come once ("already downloaded" after that).
      # requirements.lock holds the hashes of every version's wheels.
      # --platform: wheels for glibc 2.34 or older, whatever the runner (pip
      # needs the older tags named too; Debian 12 has glibc 2.36).
      - name: Vendor runtime dependency wheels into the wheelhouse
        run: |
          python -m pip install --upgrade pip
          pip download \
            --require-hashes \
            -r requirements.lock \
            --only-binary=:all: \
            --platform manylinux_2_34_x86_64 \
            --platform manylinux_2_28_x86_64 \
            --platform manylinux_2_17_x86_64 \
            --platform manylinux2014_x86_64 \
            --python-version 311 \
            --dest dist
          pip download \
            --require-hashes \
            -r requirements.lock \
            --only-binary=:all: \
            --platform manylinux_2_34_x86_64 \
            --platform manylinux_2_28_x86_64 \
            --platform manylinux_2_17_x86_64 \
            --platform manylinux2014_x86_64 \
            --python-version 312 \
            --dest dist
          pip download \
            --require-hashes \
            -r requirements.lock \
            --only-binary=:all: \
            --platform manylinux_2_34_x86_64 \
            --platform manylinux_2_28_x86_64 \
            --platform manylinux_2_17_x86_64 \
            --platform manylinux2014_x86_64 \
            --python-version 313 \
            --dest dist
      # Exactly one DSM wheel of each kind, under the names install.sh picks:
      # a second one, or none, stops the release before anything is signed.
      - name: Check the DSM wheels
        run: |
          v="$(sed -n 's/^DSM_VERSION="\(.*\)"$/\1/p' install.sh)"
          [ -n "$v" ] || { echo "no DSM_VERSION in install.sh"; exit 1; }
          for prefix in "dsm-${v}-cp311-abi3-" "dsm-${v}+soft-cp311-abi3-"; do
            set -- dist/"${prefix}"*_x86_64.whl
            [ -e "$1" ] || set --  # no match: the glob is left as it is
            if [ "$#" -ne 1 ]; then
              echo "dist/ must hold exactly one ${prefix}*_x86_64.whl; found: ${*:-(none)}"
              exit 1
            fi
          done
      - name: Generate SHA256SUMS over all artifacts
        run: |
          cd dist
          # Covers every wheel (DSM tpm + DSM +soft + all vendored dep wheels),
          # the sdist, install.sh and the systemd units — the signed list is the single trust
          # anchor the installer verifies the entire local wheelhouse against.
          sha256sum * > SHA256SUMS
      - name: Sign SHA256SUMS with minisign
        env:
          # TODO(owner): add these two REPO SECRETS before the first release.
          #   MINISIGN_SECRET_KEY  — the OWNER-ONLY minisign signing PRIVATE key
          #                          (the full .key file contents, base64 block).
          #   MINISIGN_KEY_PASSWORD — the password protecting that private key.
          # The matching PUBLIC key is embedded in install.sh for verify-before-
          # execute. Do NOT commit the private key or password — secrets only.
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_KEY_PASSWORD: ${{ secrets.MINISIGN_KEY_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y minisign
          umask 077
          KEYFILE="$(mktemp)"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$KEYFILE"
          # minisign reads the key password from stdin in non-interactive use;
          # feed the owner secret so no prompt blocks the runner.
          printf '%s\n' "$MINISIGN_KEY_PASSWORD" | \
            minisign -S -s "$KEYFILE" -m dist/SHA256SUMS
          shred -u "$KEYFILE"
      - name: Determine pre-release flag (0.x tags are pre-releases)
        id: prerelease
        run: |
          # A 0.x.y tag (v0.*) carries no SemVer-stability promise → pre-release.
          if printf '%s' "${GITHUB_REF_NAME}" | grep -Eq '^v0\.'; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda  # v2.2.1
        with:
          # <OWNER/REPO> is implicit via ${{ github.repository }} — softprops
          # publishes to the repo the workflow runs in; no slug to fill in here.
          prerelease: ${{ steps.prerelease.outputs.value }}
          fail_on_unmatched_files: true
          # `files` is a block scalar consumed line-by-line by the action as
          # glob patterns — comments cannot live INSIDE it, so this note stays
          # here: `dist/*.whl` uploads BOTH DSM wheels AND every vendored
          # runtime-dep wheel (cryptography/cffi/pycparser/dnspython), so
          # install.sh can fetch the whole verified wheelhouse from the Release.
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/install.sh
            dist/*.service
            dist/*.timer
            dist/dsm-blocklist-update.sh
            dist/SHA256SUMS
            dist/SHA256SUMS.minisig
