#!/usr/sbin/nft -f
#
# DSM VPN Kill Switch
# Applied when FSM enters ESTABLISHED, removed on TEARDOWN.
#
# Placeholders: {SERVER_IP}, {SERVER_PORT}, {TUN_NAME}, {IP_PROTO}
# Replaced at runtime by the Python nftables manager. {IP_PROTO} resolves
# to "ip" (IPv4 server) or "ip6" (IPv6 server) based on server_ip's family.
# The complementary AF rule remains dropped by the chain's default policy.

table inet dsm_killswitch {
    chain output {
        type filter hook output priority 0; policy drop;

        oif "lo" accept

        # Allow traffic to/from VPN server (the tunnel endpoint itself).
        # {IP_PROTO} = "ip" for IPv4 server, "ip6" for IPv6 server.
        {IP_PROTO} daddr {SERVER_IP} udp dport {SERVER_PORT} accept
        {IP_PROTO} saddr {SERVER_IP} udp sport {SERVER_PORT} accept
        # TCP fallback
        {IP_PROTO} daddr {SERVER_IP} tcp dport {SERVER_PORT} accept

        oif "{TUN_NAME}" accept

        # Allow DHCP (network connectivity). M-DEPLOY-6: gate by oif so
        # an inside-tunnel application speaking DHCP doesn't also pass —
        # only the host's normal DHCP client (which goes out the WAN,
        # not the tunnel) should be allowed.
        oif != "{TUN_NAME}" udp dport 67 udp sport 68 accept

        # VPN control traffic (marked)
        ct state established,related meta mark 0x1 accept

        # Block all IPv6 on non-TUN interfaces to prevent dual-stack leaks.
        # MUST come before the icmpv6 rate-limit accept below — otherwise
        # 2 ICMPv6 packets/sec (Router Solicitations, NS, echo) slip onto
        # the WAN interface, confirming host presence to a LAN observer
        # and providing a low-bandwidth covert channel.
        # IPv6 through the tunnel is allowed by the oif "{TUN_NAME}" rule above.
        oif != "{TUN_NAME}" meta nfproto ipv6 counter drop

        # ICMP rate-limit (allow basic connectivity, prevent covert channels)
        meta l4proto icmp limit rate 2/second accept
        meta l4proto icmpv6 limit rate 2/second accept

        counter drop
    }

    chain input {
        type filter hook input priority 0; policy drop;

        iif "lo" accept

        {IP_PROTO} saddr {SERVER_IP} udp sport {SERVER_PORT} accept
        {IP_PROTO} saddr {SERVER_IP} tcp sport {SERVER_PORT} accept

        iif "{TUN_NAME}" accept

        # Allow DHCP responses (only from the WAN side, not the tunnel)
        iif != "{TUN_NAME}" udp sport 67 udp dport 68 accept

        # Allow established/related — must be marked so a stale conntrack
        # entry from another process can't sneak through.
        ct state established,related meta mark 0x1 accept

        # Block all IPv6 on non-TUN interfaces — MUST precede ICMP accept.
        iif != "{TUN_NAME}" meta nfproto ipv6 counter drop

        # L-NET-1: explicitly drop ICMP redirects so a LAN-side attacker
        # cannot install a route bypassing the TUN even if the host's
        # accept_redirects sysctl was left at 1. icmp type 5 is
        # redirect; drop unconditionally before the general icmp
        # accept rule below.
        icmp type redirect counter drop

        # ICMP rate-limit (IPv4 only — IPv6 dropped above)
        meta l4proto icmp limit rate 2/second accept

        counter drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }
}

# DNS leak prevention: block all DNS and name resolution except through tunnel
table inet dsm_dns_leak {
    chain output {
        type filter hook output priority -10; policy accept;

        oif != "{TUN_NAME}" udp dport 53 counter drop
        oif != "{TUN_NAME}" tcp dport 53 counter drop

        # Block DoT on non-tunnel interfaces
        oif != "{TUN_NAME}" tcp dport 853 counter drop
        # Block DoQ (DNS-over-QUIC) on non-tunnel interfaces
        oif != "{TUN_NAME}" udp dport 853 counter drop

        # Block DoH: prevent HTTPS to non-server IPs on non-tunnel interfaces.
        # NOTE: This blocks ALL HTTPS on non-TUN except to the VPN server.
        # Applied only after FSM->ESTABLISHED; captive portal auth must
        # complete before the VPN connects.
        oif != "{TUN_NAME}" {IP_PROTO} daddr != {SERVER_IP} tcp dport 443 counter drop
        # M-DEPLOY-8: also block DoH3 (DNS-over-HTTP/3) which rides QUIC
        # on UDP/443. Browsers prefer DoH3 when available, and without
        # this rule Firefox/Chrome's QUIC DNS path bypasses dsm_dns_leak.
        # Same caveat as TCP/443: blocks ALL UDP/443 to non-server IPs.
        oif != "{TUN_NAME}" {IP_PROTO} daddr != {SERVER_IP} udp dport 443 counter drop

        # Block mDNS (multicast DNS) — leaks hostname/services to LAN
        oif != "{TUN_NAME}" udp dport 5353 counter drop
        # Block LLMNR (Link-Local Multicast Name Resolution)
        oif != "{TUN_NAME}" udp dport 5355 counter drop
    }
}
