#!/usr/sbin/nft -f
#
# DSM VPN Server Handshake-Flood Protection
# Applied before the server begins accepting, removed on shutdown.
#
# Bounds new connections (ct state new) on the listen port. Established
# flows are unaffected. Burst absorbs short spikes; sustained flood is
# dropped at the kernel layer before the server's handshake loop ever
# sees the packet.
#
# Rate-limiting is per-source-IPv4-and-per-source-IPv6 via nftables
# meters, so a single attacker spoofing one source IP cannot starve
# every legitimate client by saturating a global limit (audit M3).
# A meter slot expires after 60 s of inactivity, so the table does
# not grow unboundedly even under a million-source flood.
#
# Placeholders: {SERVER_PORT}
# Replaced at runtime by the Python nftables manager.

table inet dsm_server_ratelimit {
    chain input {
        type filter hook input priority -100; policy accept;

        # UDP handshake (and post-handshake traffic, but only first packet
        # from a peer is "new" to conntrack; after that it's "established").
        # Per-source-IP meter: each source gets its own 5/second 10-packet
        # burst budget; a flood from one source cannot starve other clients.
        udp dport {SERVER_PORT} ct state new meter dsm_ratelimit_v4 size 65535 \
            { ip saddr limit rate 5/second burst 10 packets } accept
        udp dport {SERVER_PORT} ct state new meter dsm_ratelimit6_v4 size 65535 \
            { ip6 saddr limit rate 5/second burst 10 packets } accept
        udp dport {SERVER_PORT} ct state new counter drop

        # TCP variant (TCP fallback transport).
        tcp dport {SERVER_PORT} ct state new meter dsm_ratelimit_t4 size 65535 \
            { ip saddr limit rate 5/second burst 10 packets } accept
        tcp dport {SERVER_PORT} ct state new meter dsm_ratelimit6_t4 size 65535 \
            { ip6 saddr limit rate 5/second burst 10 packets } accept
        tcp dport {SERVER_PORT} ct state new counter drop
    }
}
