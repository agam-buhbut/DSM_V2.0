#!/usr/sbin/nft -f
#
# DSM VPN — Pre-handshake kill switch.
# Applied BEFORE the client binds its transport socket so a failed or
# stuck handshake never leaks user traffic. Upgraded atomically to the
# full kill switch (nftables.conf) by NFTablesManager.apply() once the
# TUN device is up.
#
# Placeholders: {SERVER_IP}, {SERVER_PORT}, {IP_PROTO}
# Replaced at runtime by PreHandshakeKillSwitch. {IP_PROTO} resolves to
# "ip" (IPv4 server) or "ip6" (IPv6 server) based on server_ip's family.

table inet dsm_killswitch_pre {
    chain output {
        type filter hook output priority 0; policy drop;

        # Loopback
        oif "lo" accept

        # The VPN server itself (UDP transport + TCP fallback).
        {IP_PROTO} daddr {SERVER_IP} udp dport {SERVER_PORT} accept
        {IP_PROTO} daddr {SERVER_IP} tcp dport {SERVER_PORT} accept

        # DHCP renewal — roaming clients need to renew leases while DSM
        # is starting up, and the handshake itself may take a few seconds.
        udp dport 67 udp sport 68 accept

        # Block all IPv6 on non-loopback to prevent dual-stack leaks
        # during the handshake window. Must come BEFORE the icmpv6
        # accept (same ordering trap as the full kill switch).
        oif != "lo" meta nfproto ipv6 counter drop

        # Path-MTU discovery + basic connectivity, rate-limited.
        meta l4proto icmp limit rate 2/second accept

        counter drop
    }

    chain input {
        type filter hook input priority 0; policy drop;

        iif "lo" accept

        # Replies from the VPN server.
        {IP_PROTO} saddr {SERVER_IP} udp sport {SERVER_PORT} accept
        {IP_PROTO} saddr {SERVER_IP} tcp sport {SERVER_PORT} accept

        # DHCP responses
        udp sport 67 udp dport 68 accept

        # Established connections we initiated. Mark required to prevent
        # a stale conntrack entry from another process slipping through.
        ct state established,related meta mark 0x1 accept

        # IPv6 leak block before ICMP accept.
        iif != "lo" meta nfproto ipv6 counter drop

        meta l4proto icmp limit rate 2/second accept

        counter drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }
}
